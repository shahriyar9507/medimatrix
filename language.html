<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatrix - Choose Language</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <div class="page">
            <header class="screen-header">
                <span class="header-title">MediMatrix</span>
                <div class="header-icon">
                    <i data-feather="globe"></i>
                </div>
            </header>
            
            <div class="page-content">
                <div class="illustration-box">
                    <div class="phone-illustration">
                        <img src="assets/medimatrixlogo.png" alt="Logo" class="inner-logo">
                    </div>
                </div>
                
                <h2 class="section-title">আপনার ভাষা বেছে নিন</h2>
                <p class="section-subtitle">Choose your preferred language</p>

                <div class="language-options">
                    <div class="lang-card active">
                        <input type="radio" name="language" value="bn" checked style="display: none;">
                        <div class="lang-flag">🇧🇩</div>
                        <div class="lang-info">
                            <span class="lang-name">বাংলা</span>
                            <span class="lang-sub">Bangla</span>
                        </div>
                        <div class="lang-check">
                            <i class="fas fa-check-circle"></i>
                        </div>
                    </div>
                    <div class="lang-card">
                        <input type="radio" name="language" value="en" style="display: none;">
                        <div class="lang-flag">🇬🇧</div>
                        <div class="lang-info">
                            <span class="lang-name">English</span>
                            <span class="lang-sub">ইংরেজি</span>
                        </div>
                        <div class="lang-check">
                            <div class="circle-outline" style="width: 24px; height: 24px; border: 2px solid #ddd; border-radius: 50%;"></div>
                        </div>
                    </div>
                </div>

                <a href="login.html" class="btn btn-primary">
                    চালিয়ে যান / Continue <i data-feather="arrow-right"></i>
                </a>
                
                <p class="terms-text">By continuing, you agree to our <strong>Terms of Service</strong> and Privacy Policy.</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
