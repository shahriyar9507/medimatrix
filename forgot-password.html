<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatrix - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <div class="page">
            <div class="page-content">
                <div class="center" style="margin-top: 10px;">
                    <img src="assets/medimatrixlogo.png" alt="Logo" style="width: 80px;">
                </div>
                
                <h2 class="welcome-title">পাসওয়ার্ড উদ্ধার করুন</h2>
                <p class="welcome-subtitle">আপনার নম্বর দিয়ে পাসওয়ার্ড রিসেট করুন</p>

                <div class="form-card">
                    <div class="form-container">
                        <div class="input-group">
                            <label>আপনার মোবাইল নম্বর দিন</label>
                            <div class="input-wrapper">
                                <i data-feather="phone"></i>
                                <input type="text" placeholder="01604XXXXXX">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-auto">
                    <a href="forgot-otp.html" class="btn btn-primary">
                        OTP পাঠান <i data-feather="arrow-right"></i>
                    </a>
                    <p class="footer-link"><a href="login.html">লগইন পেজে ফিরে যান</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
