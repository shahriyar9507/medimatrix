<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatrix - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <div class="page">
            <div class="page-content">
                <div class="center" style="margin-top: 40px;">
                    <img src="assets/medimatrixlogo.png" alt="Logo" style="width: 80px;">
                </div>
                
                <h2 class="welcome-title">নতুন পাসওয়ার্ড</h2>
                <p class="welcome-subtitle">আপনার নতুন পাসওয়ার্ড সেট করুন</p>

                <div class="form-card">
                    <div class="form-container">
                        <div class="input-group">
                            <label>নতুন পাসওয়ার্ড দিন</label>
                            <div class="input-wrapper">
                                <i data-feather="lock"></i>
                                <input type="password" placeholder="New Password">
                                <i data-feather="eye" class="toggle-password"></i>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>পাসওয়ার্ড নিশ্চিত করুন</label>
                            <div class="input-wrapper">
                                <i data-feather="lock"></i>
                                <input type="password" placeholder="Confirm Password">
                                <i data-feather="eye" class="toggle-password"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-auto">
                    <a href="success.html" class="btn btn-primary">
                        পাসওয়ার্ড পরিবর্তন করুন <i data-feather="arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
